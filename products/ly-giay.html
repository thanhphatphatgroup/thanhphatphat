<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ly Giấy - Thành Phát Phát Plastic</title>

<link rel="stylesheet" href="../style.css">

<style>

.catalog-page{
    background:#fafafa;
    min-height:100vh;
}

.catalog-page{
    background:#fafafa;
    min-height:100vh;
}

/* ===== HERO BANNER ===== */
.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:25px;
}

.hero-banner{

    height:550px;

    background:
    linear-gradient(
    rgba(0,0,0,.45),
    rgba(0,0,0,.45)
    ),
    url("../images/banner.webp");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.hero-overlay{
    max-width:900px;
    padding:20px;
}

.hero-banner h1{
    color:#fff;
    font-size:42px;
    line-height:1.2;
    margin-bottom:15px;
}

.hero-banner p{
    font-size:18px;
    max-width:700px;
    margin:0 auto 30px;
}

.hero-stats{

    display:flex;
    justify-content:center;
    gap:20px;

    margin-bottom:35px;
}

.stat-box{

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(10px);

    padding:18px 25px;

    border-radius:15px;

    min-width:170px;
}

.stat-box strong{
    display:block;
    font-size:22px;
    margin-bottom:6px;
}

.stat-box span{
    font-size:14px;
}

.catalog-header{
    text-align:center;
    padding:60px 20px;
}

.catalog-header h1{
    margin-bottom:15px;
}

.catalog-header p{
    max-width:700px;
    margin:auto;
}

.catalog-actions{
    margin-top:25px;
}

.catalog-grid{
    max-width:1400px;
    margin:auto;
    padding:0 40px 80px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.catalog-item{
    overflow:hidden;
    border-radius:18px;
    background:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.3s;
}

.catalog-item:hover{
    transform:translateY(-5px);
}

.catalog-item img{
    width:100%;
    display:block;
    transition:.35s;
}

.catalog-item:hover img{
    transform:scale(1.03);
}

@media(max-width:768px){

    .catalog-grid{
        padding:0 16px 40px;
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

}

</style>

</head>

<body class="catalog-page">

<section class="hero-banner">

    <div class="hero-overlay">

        <h1>LY GIẤY IN LOGO THEO YÊU CẦU</h1>

        <p>
            Bộ sưu tập các mẫu ly giấy được thực hiện bởi
            Thành Phát Phát Plastic.
        </p>

        <div class="hero-stats">

            <div class="stat-box">
                <strong>100+</strong>
                <span>Mẫu thiết kế</span>
            </div>

            <div class="stat-box">
                <strong>4oz - 22oz</strong>
                <span>Nhiều dung tích</span>
            </div>

            <div class="stat-box">
                <strong>OEM</strong>
                <span>In logo riêng</span>
            </div>

        </div>

        <div class="hero-buttons">

            <a href="#catalog" class="btn primary">
                Xem bộ sưu tập
            </a>

            <a href="../index.html" class="btn secondary">
                ← Trang chủ
            </a>

        </div>

    </div>

</section>

<section>

    <div id="catalog" class="catalog-grid">

    </div>

    <div id="loadMore"></div>

</section>

<div id="zoomOverlay">
    <img id="zoomImg">
</div>

<script src="catalog.js"></script>

</body>
</html>
