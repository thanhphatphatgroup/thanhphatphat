<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ly Nhựa PET, PP In Logo Theo Yêu Cầu | Thành Phát Phát Plastic</title>

    <meta name="description" content="Ly nhựa PET và PP chất lượng cao, nhiều dung tích, phù hợp trà sữa, nước ép, cà phê và đồ uống mang đi. Nhận in logo theo yêu cầu tại Thành Phát Phát Plastic.">

    <!-- FAVICON (LOGO TRÊN TAB TRÌNH DUYỆT) -->
    <link rel="icon" href="../images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="../images/logo.png">

    <link rel="stylesheet" href="../style.css">

    <style>
        .catalog-page {
            background: #fafafa;
            min-height: 100vh;
        }

        /* ===== HERO BANNER ===== */
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .hero-banner {
            height: 550px;
            background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .45)), url("../images/banner.webp");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-overlay {
            max-width: 900px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .hero-banner h1 {
            color: #fff;
            font-size: 42px;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .hero-banner p {
            color: #fff;
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-box {
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(10px);
            padding: 18px 25px;
            border-radius: 15px;
            min-width: 170px;
        }

        .stat-box strong {
            display: block;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .stat-box span {
            font-size: 14px;
        }

        /* ===== CHUẨN PINTEREST FLEXBOX (SIÊU MƯỢT - KHÔNG LAG) ===== */
        .catalog-grid {
            max-width: 1400px;
            margin: auto;
            padding: 0 40px 80px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .masonry-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .catalog-item {
            overflow: hidden;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            cursor: pointer;
            transition: transform 0.3s ease;
            will-change: transform;
        }

        .catalog-item:hover {
            transform: translateY(-5px);
        }

        .catalog-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.35s ease;
        }

        .catalog-item:hover img {
            transform: scale(1.03);
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media(max-width:768px) {
            .hero-banner {
                height: auto;
                padding: 70px 15px;
            }

            .hero-overlay {
                width: 100%;
                padding: 10px;
            }

            .hero-banner h1 {
                font-size: 28px;
                line-height: 1.25;
            }

            .hero-banner p {
                font-size: 16px;
                margin-bottom: 20px;
            }

            .hero-stats {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
                width: 100%;
            }

            .stat-box {
                min-width: unset;
                width: 100%;
                box-sizing: border-box;
                padding: 15px;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }

            .hero-buttons a {
                width: 100%;
                max-width: 320px;
            }

            .catalog-grid {
                padding: 20px 12px 40px;
                gap: 10px;
            }

            .masonry-col {
                gap: 10px;
            }

            /* Trên điện thoại ẩn bớt 1 cột để hiện 2 cột Pinterest mượt đét */
            .masonry-col:nth-child(3) {
                display: none;
            }
        }
    </style>
</head>

<body class="catalog-page">

    <!-- HERO BANNER -->
    <section class="hero-banner">
        <div class="hero-overlay reveal show">
            <h1>LY NHỰA IN LOGO THEO YÊU CẦU</h1>
            <p>Bộ sưu tập các mẫu ly nhựa được thực hiện bởi Thành Phát Phát Plastic.</p>

            <div class="hero-stats">
                <div class="stat-box">
                    <strong>100+</strong>
                    <span>Mẫu thiết kế</span>
                </div>
                <div class="stat-box">
                    <strong>360ml - 1000ml</strong>
                    <span>Nhiều dung tích</span>
                </div>
                <div class="stat-box">
                    <strong>LOGO</strong>
                    <span>In logo riêng</span>
                </div>
            </div>

            <div class="hero-buttons">
                <a href="#catalog" class="btn primary">Xem bộ sưu tập</a>
                <a href="../index.html" class="btn secondary">← Trang chủ</a>
            </div>
        </div>
    </section>

    <!-- CATALOG GRID -->
    <section>
        <div id="catalog" class="catalog-grid" data-folder="ly-nhua"></div>
        <div id="loadMore"></div>
    </section>

    <!-- ZOOM OVERLAY -->
    <div id="zoomOverlay">
        <img id="zoomImg" alt="Phóng to ảnh">
    </div>

    <!-- FLOATING BUTTONS (ZALO, FACEBOOK, TIKTOK) -->
    <a href="https://zalo.me/0979738939" class="zalo-btn" target="_blank" rel="noopener">
        <img src="../images/zalo.webp" alt="zalo">
    </a>
    <a href="https://www.facebook.com/share/189bfVUHbx/" class="facebook-btn" target="_blank" rel="noopener">
        <img src="../images/facebook.webp" alt="facebook">
    </a>
    <a href="https://www.tiktok.com/@raider_8939?is_from_webapp=1&sender_device=pc" class="tiktok-btn" target="_blank" rel="noopener">
        <img src="../images/tiktok.webp" alt="tiktok">
    </a>

    <!-- BACK TO TOP -->
    <button id="backToTop" aria-label="Trở về đầu trang">↑</button>

    <!-- SCRIPTS -->
    <script>
        window.PRODUCT_PAGE = true;
    </script>
    <script src="../script.js"></script>
    <script src="catalog.js"></script>

</body>
</html>
